<!--
  Source for every file in src-tauri/icons — regenerate with `npm run icons`.
  Mirrors NotesMark in the website repo (src/app/app-marks.tsx and
  scripts/generate-icons.mjs): steel gradient tile at 25 % corner radius,
  white glyph at 60 % of the tile on a 24-unit grid, stroke 2.5.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 24 24">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5B7BAA"/>
      <stop offset="100%" stop-color="#3C5070"/>
    </linearGradient>
  </defs>
  <rect width="24" height="24" rx="6" fill="url(#tile)"/>
  <g transform="translate(4.8 4.8) scale(0.6)"
     fill="none" stroke="#fff" stroke-width="2.5"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 3.75h16"/>
    <path d="M4 9.25h16"/>
    <path d="M4 14.75h16"/>
    <path d="M4 20.25h9"/>
  </g>
</svg>
