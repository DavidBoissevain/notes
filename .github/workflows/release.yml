name: Release

# Releasing = bumping "version" in src-tauri/tauri.conf.json and pushing to
# main. This workflow then builds, creates the v<version> tag and release, and
# publishes it so the in-app updater picks it up. Pushes that don't introduce a
# new version do nothing.
on:
  push:
    branches:
      - main
    paths:
      - src-tauri/tauri.conf.json
  workflow_dispatch:

# Never run two releases at once
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      exists: ${{ steps.version.outputs.exists }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Read app version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v$(jq -r .version src-tauri/tauri.conf.json)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $tag already exists, nothing to do."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Releasing $tag."
          fi

  build:
    needs: check
    if: needs.check.outputs.exists == 'false'
    runs-on: windows-latest

    # Only what creating a release needs
    permissions:
      contents: write

    # Third-party actions are pinned to exact commits: this job holds the
    # updater signing key, so a moved tag must not be able to change what runs.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # Creates the release as a draft; it is published in the last step, once
      # every file is attached.
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ needs.check.outputs.tag }}
          releaseName: "Notes ${{ needs.check.outputs.tag }}"
          releaseBody: "See the assets below to download the installer for your platform."
          releaseDraft: true
          prerelease: false
          args: ""

      # The versioned installer name changes every release, so also attach a
      # copy under a fixed name. The website links to
      # releases/latest/download/FykaNotes-setup.exe, which GitHub resolves to
      # this file on the newest published release.
      - name: Upload installer under a fixed name
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          Copy-Item $exe.FullName FykaNotes-setup.exe
          gh release upload "${{ needs.check.outputs.tag }}" FykaNotes-setup.exe --clobber

      # Publishing creates the git tag and makes this the latest release, which
      # is what the in-app updater and the website download link read.
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ needs.check.outputs.tag }}" --draft=false --latest
