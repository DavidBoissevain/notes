name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Only what creating a release needs
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    # Third-party actions are pinned to exact commits: this job holds the
    # updater signing key, so a moved tag must not be able to change what runs.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Notes ${{ github.ref_name }}"
          releaseBody: "See the assets below to download the installer for your platform."
          releaseDraft: true
          prerelease: false
          args: ""

      # The versioned installer name changes every release, so also attach a
      # copy under a fixed name. The website links to
      # releases/latest/download/FykaNotes-setup.exe, which GitHub resolves to
      # this file on the newest published release.
      - name: Upload installer under a fixed name
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          Copy-Item $exe.FullName FykaNotes-setup.exe
          gh release upload "${{ github.ref_name }}" FykaNotes-setup.exe --clobber
